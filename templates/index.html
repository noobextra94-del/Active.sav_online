<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZAFRAN - UE4 Active.sav Ultimate Tool</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
        
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #38bdf8;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9));
            border: 2px solid #a855f7;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
        }
        h2 {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            background: linear-gradient(90deg, #f43f5e, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            margin-bottom: 25px;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            color: #f43f5e;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #090d16;
            border: 1px solid #38bdf8;
            color: #34d399;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 0 8px rgba(56, 189, 248, 0.3);
            transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: #f43f5e;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.6);
        }
        .vector-box { display: flex; gap: 8px; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-save {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .btn-save:hover { background: linear-gradient(135deg, #2563eb, #1e40af); box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
        
        .btn-download {
            background: linear-gradient(135deg, #10b981, #047857);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }
        .btn-download:hover { background: linear-gradient(135deg, #059669, #065f46); box-shadow: 0 0 20px rgba(16, 185, 129, 0.8); }

        .msg {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .file-status {
            background: rgba(56, 189, 248, 0.1);
            border: 1px dashed #38bdf8;
            padding: 8px;
            margin-bottom: 15px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
            color: #38bdf8;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ UE4 ACTIVE.SAV TOOL ⚡</h2>
        
        {% if message %}
            <div class="msg">{{ message }}</div>
        {% endif %}
        
        {% if file_loaded %}
            <div class="file-status">📂 Active File Locked: <b>{{ file_loaded }}</b></div>
        {% endif %}
        
        <form action="/" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>📁 Select Active.sav (Optional agar pehle se loaded hai):</label>
                <input type="file" name="file">
            </div>
            <div class="form-group">
                <label>⚙️ Select Property Type:</label>
                <select name="prop_type" id="propType" onchange="toggleInputs()">
                    <option value="FloatProperty">FloatProperty</option>
                    <option value="IntProperty">IntProperty</option>
                    <option value="BoolProperty">BoolProperty</option>
                    <option value="StringProperty">StringProperty</option>
                    <option value="DoubleProperty">DoubleProperty</option>
                    <option value="VectorProperty">VectorProperty (X, Y, Z)</option>
                </select>
            </div>
            <div class="form-group">
                <label>📝 Property Name:</label>
                <input type="text" name="prop_name" placeholder="e.g. PlayerHealth" required>
            </div>
            <div class="form-group" id="normalValueDiv">
                <label>🔢 Property Value:</label>
                <input type="text" name="prop_val" placeholder="Enter value">
            </div>
            <div class="form-group" id="vectorValueDiv" style="display: none;">
                <label>📐 Vector Coordinates:</label>
                <div class="vector-box">
                    <input type="number" step="any" name="vec_x" placeholder="X">
                    <input type="number" step="any" name="vec_y" placeholder="Y">
                    <input type="number" step="any" name="vec_z" placeholder="Z">
                </div>
            </div>
            
            <div class="btn-group">
                <button type="submit" name="action" value="save_more" class="btn-save">💾 Save & Add More</button>
                <button type="submit" name="action" value="download" class="btn-download">📥 Finalize & Download</button>
            </div>
        </form>
        <div class="footer">DEVELOPED BY ZAFRAN | SECURE SYSTEM</div>
    </div>

    <script>
        function toggleInputs() {
            let pType = document.getElementById('propType').value;
            let normalDiv = document.getElementById('normalValueDiv');
            let vectorDiv = document.getElementById('vectorValueDiv');
            if (pType === 'VectorProperty') {
                normalDiv.style.display = 'none';
                vectorDiv.style.display = 'block';
            } else {
                normalDiv.style.display = 'block';
                vectorDiv.style.display = 'none';
            }
        }
    </script>
</body>
</html>
