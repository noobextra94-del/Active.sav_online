<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAFRAN - UE4 Active.sav Tool</title>
    <style>
        body {
            background-color: #0b0f0b;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #121a12;
            border: 2px solid #00ff66;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
        }
        h2 { text-align: center; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #00ffff; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #1a261a;
            border: 1px solid #00ff66;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ff66;
            color: #000000;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { background: #00cc52; box-shadow: 0 0 10px #00ff66; }
        .footer { text-align: center; margin-top: 15px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ UE4 Active.sav Tool ⚡</h2>
        <form action="/" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>📁 Upload Active.sav File:</label>
                <input type="file" name="file" required>
            </div>
            <div class="form-group">
                <label>⚙️ Property Type:</label>
                <select name="prop_type">
                    <option value="FloatProperty">FloatProperty</option>
                    <option value="IntProperty">IntProperty</option>
                    <option value="BoolProperty">BoolProperty</option>
                </select>
            </div>
            <div class="form-group">
                <label>📝 Property Name:</label>
                <input type="text" name="prop_name" placeholder="e.g. PlayerHealth" required>
            </div>
            <div class="form-group">
                <label>🔢 Property Value:</label>
                <input type="text" name="prop_val" placeholder="e.g. 100.5" required>
            </div>
            <button type="submit">Inject & Download Modified File</button>
        </form>
        <div class="footer">Created by ZAFRAN | Online Edition</div>
    </div>
</body>
</html>
